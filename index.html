<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1418"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style><script>if("serviceWorker" in navigator && location.protocol==="https:"){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script></head><body><title>Schicht-Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: alles auf einem Handy-Bildschirm – Uhr und Datum in einer Zeile, kompakte Schichtkarte, 2×2 Kacheln, Fußzeile unten */
:root {
  --bg: #0f1418;
  --panel: #171e24;
  --line: #26303a;
  --fg: #e7ecef;
  --muted: #8b98a3;
  --accent: #f0a63a;      /* Signal-Amber wie eine Schicht-Ampel */
  --ok: #5fc48b;
  --warn: #f0a63a;
  --bad: #ef6b5b;
  --sh-f: #f0a63a;        /* Frühschicht */
  --sh-s: #6fb0e0;        /* Spätschicht */
  --sh-n: #a395e6;        /* Nachtschicht */
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
html, body { background: var(--bg); color: var(--fg); }
body {
  min-height: 100%;
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px;
  display: flex;
}
.wrap {
  width: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
}

/* Uhr: Zeit links, Datum rechts */
.clock { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.time {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(52px, 17vw, 78px); line-height: .9; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.time .sec { font-size: .36em; color: var(--muted); font-weight: 500; margin-left: 3px; }
.date { color: var(--muted); font-size: 14px; text-align: right; line-height: 1.25; padding-bottom: 4px; }
.date b { display: block; color: var(--fg); font-weight: 600; font-size: 16px; }

.label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--muted); font-weight: 600;
}

/* Schicht */
.shift {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 11px 12px; display: grid; gap: 7px;
  border-left: 4px solid var(--accent);
}
.shift-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.shift-name { font-family: var(--font-display); font-size: 25px; font-weight: 700; line-height: 1; }
.shift-start { font-family: var(--font-display); font-size: 19px; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.countdown { font-size: 15px; }
.countdown b { font-variant-numeric: tabular-nums; }
.arrive { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.arrive b { color: var(--fg); font-weight: 600; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 2px; }
.day {
  display: grid; justify-items: center; gap: 2px; padding: 4px 0 5px;
  border-radius: 8px; border: 1px solid transparent; min-width: 0;
}
.day.today { border-color: var(--line); background: rgba(255,255,255,.03); }
.day small { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.2; }
.chip {
  font: 700 12px/1 var(--font-display); letter-spacing: .02em;
  width: 26px; height: 20px; border-radius: 5px; display: grid; place-items: center;
  color: #12161a;
}
.chip.F { background: var(--sh-f); }
.chip.S { background: var(--sh-s); }
.chip.N, .chip.N1 { background: var(--sh-n); }
.chip.X { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.chip.U { background: transparent; color: var(--muted); }

/* Kacheln */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 9px 11px 10px; display: grid; gap: 3px; align-content: start; min-width: 0;
}
.big {
  font-family: var(--font-display); font-weight: 600; font-size: 32px; line-height: 1;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.big .unit { font-size: .5em; color: var(--muted); margin-left: 2px; }
.sub { color: var(--muted); font-size: 12px; line-height: 1.3; min-height: 16px; }
.meta { color: var(--muted); font-size: 12px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.up { color: var(--ok); } .down { color: var(--bad); }

.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .4s; }

.foot { margin-top: auto; display: grid; gap: 7px; }
.btns { display: flex; gap: 8px; }
.btn {
  flex: 1;
  font: 600 13px/1 var(--font-body); color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 6px; cursor: pointer; min-width: 0;
}
a.btn { display: block; text-align: center; text-decoration: none; white-space: nowrap; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
[hidden] { display: none !important; }
.view { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 11px 12px; display: grid; gap: 6px;
}
.page-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-top: 4px; }
.page-title { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; }
.span2 { grid-column: 1 / -1; }
.fx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fx-cell { display: grid; gap: 3px; min-width: 0; }
.fx-cell + .fx-cell { border-left: 1px solid var(--line); padding-left: 12px; }
.coin-name { font-weight: 600; font-size: 15px; }
.coin-name small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.coin-price { font-family: var(--font-display); font-weight: 600; font-size: 23px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.coin-ch { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Verlaufskurven & Diagramm */
.coin {
  display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 12px;
  width: 100%; text-align: left; font: inherit; color: inherit; background: none; cursor: pointer;
  border: 0; border-top: 1px solid var(--line); padding: 8px 0;
}
.coin:first-of-type { border-top: 0; padding-top: 2px; }
.coin:focus-visible, .fx-spark:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 6px; }
.coin-val { display: grid; justify-items: end; gap: 1px; }
.coin-price { font-size: 21px; }
.coin-ch { font-size: 12px; }
.spark { height: 32px; min-width: 0; }
.spark.empty { font-size: 11px; color: var(--muted); display: grid; place-items: center; }
.fx-spark {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
  width: 100%; font: inherit; color: var(--muted); background: none; border: 0; padding: 2px 0 0; cursor: pointer; text-align: left;
}
.fx-spark small { font-size: 11px; white-space: nowrap; }
.more { color: var(--muted); font-size: 18px; line-height: 1; }
.hint { font-size: 11px; color: var(--muted); text-align: center; }
.sheet {
  position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-inner { max-width: 520px; margin: 0 auto; display: grid; gap: 10px; }
.back {
  justify-self: start; font: 600 14px/1 var(--font-body); color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer;
}
.back:focus-visible, .seg-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.sh-now { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.sh-now .big { color: var(--fg); font-size: 36px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.seg-btn { font: 600 13px/1 var(--font-body); color: var(--muted); background: transparent; border: 0; border-radius: 8px; padding: 9px 4px; cursor: pointer; }
.seg-btn[aria-pressed="true"] { background: var(--line); color: var(--fg); }
.chart { position: relative; min-height: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px 4px 10px; touch-action: pan-y; }
.chart svg { display: block; overflow: visible; }
.tip {
  position: absolute; top: 6px; display: grid; gap: 1px; pointer-events: none; white-space: nowrap;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12px; color: var(--muted);
}
.tip b { color: var(--fg); font-size: 14px; font-variant-numeric: tabular-nums; }

.wide { flex: none; width: 100%; padding: 11px 10px; }
.tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
}
.tab {
  font: 600 14px/1 var(--font-body); color: var(--muted); background: transparent;
  border: 0; border-radius: 10px; padding: 10px 6px; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--line); color: var(--fg); }
.tab:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<main class="wrap">
  <div class="view" id="viewStart" role="tabpanel" aria-label="Start">
    <section class="clock" aria-label="Uhrzeit">
      <div class="time" id="time">--:--<span class="sec">--</span></div>
      <div class="date" id="date">&nbsp;</div>
    </section>

    <section class="shift" aria-label="Schicht">
      <div class="shift-head">
        <div>
          <div class="label" id="shiftLabel">Heute · Dottikon</div>
          <div class="shift-name" id="shiftName">–</div>
        </div>
        <div class="shift-start" id="shiftStart"></div>
      </div>
      <div class="arrive" id="arrive">&nbsp;</div>
      <div class="countdown" id="countdown">&nbsp;</div>
      <div class="week" id="week" aria-label="Nächste 7 Tage"></div>
    </section>

    <section class="tiles" aria-label="Live-Werte">
      <div class="tile">
        <div class="label">Lörrach</div>
        <div class="big" id="tLoe">–<span class="unit">°C</span></div>
        <div class="sub" id="wLoe">&nbsp;</div>
        <div class="meta" id="mLoe">&nbsp;</div>
      </div>
      <div class="tile">
        <div class="label">Dottikon</div>
        <div class="big" id="tDot">–<span class="unit">°C</span></div>
        <div class="sub" id="wDot">&nbsp;</div>
        <div class="meta" id="mDot">&nbsp;</div>
      </div>
      <div class="tile span2">
        <div class="label">Akku</div>
        <div class="big" id="bat">–<span class="unit">%</span></div>
        <div class="bar" aria-hidden="true"><i id="batBar"></i></div>
        <div class="sub" id="batSub">&nbsp;</div>
      </div>
    </section>
  </div>

  <div class="view" id="viewKurse" role="tabpanel" aria-label="Kurse" hidden>
    <div class="page-head">
      <div class="page-title">Kurse</div>
      <div class="label" id="kStand">&nbsp;</div>
    </div>

    <section class="card" aria-label="Wechselkurs">
      <div class="label">Wechselkurs</div>
      <div class="fx-grid">
        <div class="fx-cell"><div class="sub">EUR → CHF · 1 € =</div><div class="big" id="fxChf">–</div></div>
        <div class="fx-cell"><div class="sub">CHF → EUR · 1 CHF =</div><div class="big" id="fxEur">–</div></div>
      </div>
      <button type="button" class="fx-spark" data-asset="fx" aria-label="Wechselkurs: Diagramm öffnen">
        <div class="spark" id="sFx"></div><small>30 Tage ›</small>
      </button>
      <div class="sub" id="fxSub">&nbsp;</div>
    </section>

    <section class="card" aria-label="Krypto in Euro">
      <div class="label">Krypto in Euro · Kurve 7 T · % 24 h</div>
      <button type="button" class="coin" data-asset="bitcoin" aria-label="Bitcoin: Diagramm öffnen"><div class="coin-name">Bitcoin<small>BTC</small></div><div class="spark" id="sBtc"></div><div class="coin-val"><div class="coin-price" id="pBtc">–</div><div class="coin-ch" id="cBtc"></div></div></button>
      <button type="button" class="coin" data-asset="solana" aria-label="Solana: Diagramm öffnen"><div class="coin-name">Solana<small>SOL</small></div><div class="spark" id="sSol"></div><div class="coin-val"><div class="coin-price" id="pSol">–</div><div class="coin-ch" id="cSol"></div></div></button>
      <button type="button" class="coin" data-asset="ripple" aria-label="XRP: Diagramm öffnen"><div class="coin-name">XRP<small>XRP</small></div><div class="spark" id="sXrp"></div><div class="coin-val"><div class="coin-price" id="pXrp">–</div><div class="coin-ch" id="cXrp"></div></div></button>
    </section>

    <div class="hint">Antippen zeigt das große Diagramm</div>
    <a class="btn wide" id="markets" href="https://www.finanzen.net/" target="_blank" rel="noopener">Börse &amp; News öffnen</a>
  </div>

  <div class="foot">
    <div class="btns">
      <button type="button" class="btn" id="refresh">Aktualisieren</button>
      <button type="button" class="btn" id="wake" aria-pressed="false">Bildschirm an</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Seiten">
      <button type="button" class="tab" role="tab" id="tabStart" aria-controls="viewStart" aria-selected="true">Start</button>
      <button type="button" class="tab" role="tab" id="tabKurse" aria-controls="viewKurse" aria-selected="false">Kurse</button>
    </nav>
  </div>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <div class="sheet-inner">
    <button type="button" class="back" id="shBack">‹ Zurück</button>
    <div>
      <div class="label" id="shSub">&nbsp;</div>
      <div class="page-title" id="shTitle">&nbsp;</div>
    </div>
    <div class="sh-now"><span class="big" id="shPrice">–</span><span id="shChg"></span></div>
    <div class="seg" id="shRanges" role="group" aria-label="Zeitraum"></div>
    <div class="chart" id="shChart"></div>
    <div class="sub" id="shInfo">&nbsp;</div>
  </div>
</div>


<script>
(() => {
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  /* Schichtplan aus Supershift-PDF 2026. F=Früh, S=Spät, N1=1. Nacht, N=Nacht, X=Frei */
  const PLAN = {"2026-11-01":"N","2026-11-02":"X","2026-11-03":"X","2026-11-04":"F","2026-11-05":"F","2026-11-06":"S","2026-11-07":"S","2026-11-08":"S","2026-11-09":"N1","2026-11-10":"N","2026-11-11":"X","2026-11-12":"X","2026-11-13":"F","2026-11-14":"F","2026-11-15":"F","2026-11-16":"S","2026-11-17":"S","2026-11-18":"N1","2026-11-19":"N","2026-11-20":"X","2026-11-21":"X","2026-11-22":"X","2026-11-23":"F","2026-11-24":"F","2026-11-25":"S","2026-11-26":"S","2026-11-27":"N1","2026-11-28":"N","2026-11-29":"N","2026-11-30":"X","2026-12-01":"X","2026-12-02":"F","2026-12-03":"F","2026-12-04":"S","2026-12-05":"S","2026-12-06":"S","2026-12-07":"N1","2026-12-08":"N","2026-12-09":"X","2026-12-10":"X","2026-12-11":"F","2026-12-12":"F","2026-12-13":"F","2026-12-14":"S","2026-12-15":"S","2026-12-16":"N1","2026-12-17":"N","2026-12-18":"X","2026-12-19":"X","2026-12-20":"X","2026-12-21":"F","2026-12-22":"F","2026-12-23":"S","2026-12-24":"S","2026-12-25":"N1","2026-12-26":"N","2026-12-27":"N","2026-12-28":"X","2026-12-29":"X","2026-12-30":"F","2026-12-31":"F"};
  /* Zeiten: Ankunft vor Ort (laut Marcel) und Schicht laut Kalender-Export */
  const TYPES = {
    F:  { name: "Frühschicht",  short: "F", arrive: [4, 30],  start: [4, 50],  end: [13, 20], night: false },
    S:  { name: "Spätschicht",  short: "S", arrive: [12, 30], start: [12, 50], end: [21, 20], night: false },
    N1: { name: "1. Nacht",     short: "N", arrive: [20, 30], start: [20, 50], end: [5, 20],  night: true },
    N:  { name: "Nachtschicht", short: "N", arrive: [20, 30], start: [20, 50], end: [5, 20],  night: true },
    X:  { name: "Frei",         short: "–" }
  };
  const key = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const at = (dayKey, hm, plusDay) => {
    const [y, mo, da] = dayKey.split("-").map(Number);
    return new Date(y, mo - 1, da + (plusDay ? 1 : 0), hm[0], hm[1]);
  };
  const SHIFTS = Object.keys(PLAN).sort().filter(k => PLAN[k] !== "X").map(k => {
    const t = TYPES[PLAN[k]];
    return { day: k, code: PLAN[k], t, arrive: at(k, t.arrive), start: at(k, t.start), end: at(k, t.end, t.night) };
  });
  const LAST_DAY = Object.keys(PLAN).sort().pop();
  const hm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
  const wd = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const shortDate = d => wd[d.getDay()] + " " + pad(d.getDate()) + "." + pad(d.getMonth() + 1) + ".";
  function span(ms) {
    const min = Math.max(0, Math.floor(ms / 60000));
    const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
    if (d) return d + " T " + h + " h";
    return (h ? h + " h " : "") + m + " min";
  }
  function dayWord(d, now) {
    const a = new Date(now); a.setHours(0, 0, 0, 0);
    const b = new Date(d); b.setHours(0, 0, 0, 0);
    const diff = Math.round((b - a) / 86400000);
    return diff === 0 ? "heute" : diff === 1 ? "morgen" : shortDate(d);
  }

  /* ---------- Uhr & Schicht ---------- */
  const dateFmt = new Intl.DateTimeFormat("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  let lastWeekKey = "";
  function tick() {
    const now = new Date();
    $("time").innerHTML = pad(now.getHours()) + ":" + pad(now.getMinutes()) +
      '<span class="sec">' + pad(now.getSeconds()) + "</span>";
    const d = dateFmt.format(now);
    const i = d.indexOf(",");
    $("date").innerHTML = "<b>" + d.slice(0, i) + "</b>" + d.slice(i + 2);
    renderShift(now);
    if (key(now) !== lastWeekKey) { lastWeekKey = key(now); renderWeek(now); }
  }
  function renderShift(now) {
    const running = SHIFTS.find(s => s.start <= now && now < s.end);
    const next = SHIFTS.find(s => s.arrive > now && s !== running);
    const todayCode = PLAN[key(now)];
    const main = running || (todayCode && todayCode !== "X" ? SHIFTS.find(s => s.day === key(now) && now < s.end) : null);

    if (main) {
      $("shiftLabel").textContent = (running ? "Läuft gerade" : "Heute") + " · Dottikon";
      $("shiftName").textContent = main.t.name;
      $("shiftStart").textContent = hm(main.start) + "–" + hm(main.end);
      $("arrive").innerHTML = "Vor Ort <b>" + hm(main.arrive) + "</b> · Schicht <b>" + hm(main.start) + "</b>";
      if (running) {
        let txt = "Endet in <b>" + span(main.end - now) + "</b>";
        if (next) txt += " · danach " + next.t.name + " " + dayWord(next.arrive, now);
        $("countdown").innerHTML = txt;
      } else if (now < main.arrive) {
        $("countdown").innerHTML = "Vor Ort in <b>" + span(main.arrive - now) + "</b>";
      } else {
        $("countdown").innerHTML = "Schichtbeginn in <b>" + span(main.start - now) + "</b>";
      }
    } else if (todayCode === "X" || (todayCode && !main)) {
      $("shiftLabel").textContent = "Heute · Dottikon";
      $("shiftName").textContent = todayCode === "X" ? "Frei" : "Feierabend";
      $("shiftStart").textContent = "";
      setNext(next, now);
    } else {
      $("shiftLabel").textContent = "Heute";
      $("shiftName").textContent = "Kein Plan";
      $("shiftStart").textContent = "";
      $("arrive").textContent = "Der eingelesene Plan endet am " + LAST_DAY.split("-").reverse().join(".") + ".";
      $("countdown").textContent = "Schick Claude den neuen Schichtplan.";
    }
  }
  function setNext(next, now) {
    if (next) {
      $("arrive").innerHTML = "Nächste: <b>" + next.t.name + "</b> " + dayWord(next.arrive, now) +
        " · vor Ort <b>" + hm(next.arrive) + "</b>";
      $("countdown").innerHTML = "Noch <b>" + span(next.arrive - now) + "</b>";
    } else {
      $("arrive").textContent = "Keine weitere Schicht im eingelesenen Plan.";
      $("countdown").textContent = "Plan endet am " + LAST_DAY.split("-").reverse().join(".") + ".";
    }
  }
  function renderWeek(now) {
    const wrap = $("week");
    wrap.textContent = "";
    for (let n = 0; n < 7; n++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + n);
      const c = PLAN[key(d)];
      const cell = document.createElement("div");
      cell.className = "day" + (n === 0 ? " today" : "");
      const top = document.createElement("small");
      top.textContent = wd[d.getDay()];
      const chip = document.createElement("span");
      chip.className = "chip " + (c || "U");
      chip.textContent = c ? TYPES[c].short : "?";
      chip.title = c ? TYPES[c].name : "Nicht im Plan";
      const bot = document.createElement("small");
      bot.textContent = pad(d.getDate()) + ".";
      cell.append(top, chip, bot);
      cell.setAttribute("aria-label", shortDate(d) + ": " + (c ? TYPES[c].name : "nicht im Plan"));
      wrap.append(cell);
    }
  }
  tick(); setInterval(tick, 1000);


  /* ---------- Wetter (Open-Meteo, ohne API-Schlüssel) ---------- */
  const WMO = {0:"Klar",1:"Überwiegend klar",2:"Teils bewölkt",3:"Bedeckt",45:"Nebel",48:"Reifnebel",
    51:"Leichter Niesel",53:"Niesel",55:"Starker Niesel",56:"Gefr. Niesel",57:"Gefr. Niesel",
    61:"Leichter Regen",63:"Regen",65:"Starker Regen",66:"Gefr. Regen",67:"Gefr. Regen",
    71:"Leichter Schnee",73:"Schnee",75:"Starker Schnee",77:"Schneegriesel",
    80:"Schauer",81:"Schauer",82:"Starke Schauer",85:"Schneeschauer",86:"Schneeschauer",
    95:"Gewitter",96:"Gewitter, Hagel",99:"Gewitter, Hagel"};
  const PLACES = [
    { t: "tLoe", w: "wLoe", m: "mLoe", lat: 47.6156, lon: 7.6614 },  // Lörrach
    { t: "tDot", w: "wDot", m: "mDot", lat: 47.3840, lon: 8.2400 }   // Dottikon
  ];
  async function loadWeather() {
    for (const p of PLACES) {
      try {
        const url = "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +
          "&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,pressure_msl&timezone=Europe%2FBerlin";
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.status);
        const j = await r.json();
        const c = j.current;
        $(p.t).innerHTML = Math.round(c.temperature_2m) + '<span class="unit">°C</span>';
        $(p.w).textContent = (WMO[c.weather_code] || "–") + " · gefühlt " + Math.round(c.apparent_temperature) + "°";
        $(p.m).textContent = Math.round(c.pressure_msl) + " hPa · " + Math.round(c.relative_humidity_2m) + " % Feuchte";
      } catch (e) {
        $(p.w).textContent = "nicht verfügbar";
        $(p.m).textContent = "";
      }
    }
  }

  /* ---------- Krypto (CoinGecko, ohne API-Schlüssel) ---------- */
  const eurXrp = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", minimumFractionDigits: 3, maximumFractionDigits: 4 });
  const eurAuto = v => new Intl.NumberFormat("de-DE", {
    style: "currency", currency: "EUR",
    minimumFractionDigits: v >= 1000 ? 0 : v >= 1 ? 2 : 3,
    maximumFractionDigits: v >= 1000 ? 0 : v >= 1 ? 2 : 4
  }).format(v);
  const chg = ch => '<span class="' + (ch >= 0 ? "up" : "down") + '">' +
    (ch >= 0 ? "▲ " : "▼ ") + Math.abs(ch).toFixed(2).replace(".", ",") + " %</span>";
  const COINS = [["bitcoin", "pBtc", "cBtc"], ["solana", "pSol", "cSol"], ["ripple", "pXrp", "cXrp"]];
  async function loadCrypto() {
    try {
      const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=ripple,bitcoin,solana&vs_currencies=eur&include_24hr_change=true&include_last_updated_at=true");
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      const x = j.ripple;
      const t = new Date(x.last_updated_at * 1000);
      for (const [id, p, c] of COINS) {
        const v = j[id];
        if (!v) { $(p).textContent = "–"; $(c).textContent = ""; continue; }
        $(p).textContent = id === "ripple" ? eurXrp.format(v.eur) : eurAuto(v.eur);
        $(c).innerHTML = chg(v.eur_24h_change);
      }
      $("kStand").textContent = "Stand " + hm(t);
    } catch (e) {
      for (const [, p, c] of COINS) { $(p).textContent = "–"; $(c).textContent = ""; }
      $("kStand").textContent = "nicht verfügbar";
    }
  }

  /* ---------- Wechselkurs EUR/CHF (Frankfurter, EZB-Referenzkurs) ---------- */
  async function loadFx() {
    try {
      const r = await fetch("https://api.frankfurter.dev/v1/latest?base=EUR&symbols=CHF");
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      const rate = j.rates.CHF;
      $("fxChf").innerHTML = rate.toFixed(4).replace(".", ",") + '<span class="unit">CHF</span>';
      $("fxEur").innerHTML = (1 / rate).toFixed(4).replace(".", ",") + '<span class="unit">€</span>';
      $("fxSub").textContent = "EZB-Referenzkurs vom " + j.date.split("-").reverse().join(".");
    } catch (e) {
      $("fxChf").textContent = "–";
      $("fxEur").textContent = "–";
      $("fxSub").textContent = "nicht verfügbar";
    }
  }

  /* ---------- Seiten-Menü ---------- */
  function showView(name) {
    const isStart = name === "start";
    $("viewStart").hidden = !isStart;
    $("viewKurse").hidden = isStart;
    $("tabStart").setAttribute("aria-selected", String(isStart));
    $("tabKurse").setAttribute("aria-selected", String(!isStart));
    if (!isStart) loadSparks(false);
  }
  $("tabStart").addEventListener("click", () => showView("start"));
  $("tabKurse").addEventListener("click", () => showView("kurse"));

  /* ---------- Verläufe & Diagramme ---------- */
  const fxFmt = v => v.toFixed(4).replace(".", ",") + " CHF";
  const ASSETS = {
    bitcoin: { name: "Bitcoin", sym: "BTC · in Euro", fmt: eurAuto, spark: "sBtc", ranges: [[1, "24 h"], [7, "7 T"], [30, "30 T"], [365, "1 J"]] },
    solana:  { name: "Solana",  sym: "SOL · in Euro", fmt: eurAuto, spark: "sSol", ranges: [[1, "24 h"], [7, "7 T"], [30, "30 T"], [365, "1 J"]] },
    ripple:  { name: "XRP",     sym: "XRP · in Euro", fmt: v => eurXrp.format(v), spark: "sXrp", ranges: [[1, "24 h"], [7, "7 T"], [30, "30 T"], [365, "1 J"]] },
    fx:      { name: "Euro → Franken", sym: "EZB-Referenzkurs, 1 € in CHF", fmt: fxFmt, spark: "sFx", ranges: [[30, "30 T"], [90, "90 T"], [365, "1 J"]] }
  };
  const SPARK_DAYS = { bitcoin: 7, solana: 7, ripple: 7, fx: 30 };
  const HIST = {};
  async function getHist(asset, days) {
    const k = asset + ":" + days;
    const c = HIST[k];
    if (c && Date.now() - c.at < 10 * 60 * 1000) return c;
    let pts;
    if (asset === "fx") {
      const d = new Date(); d.setDate(d.getDate() - days);
      const start = d.toISOString().slice(0, 10);
      const r = await fetch("https://api.frankfurter.dev/v1/" + start + "..?base=EUR&symbols=CHF");
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      pts = Object.keys(j.rates || {}).sort().map(day => [Date.parse(day + "T12:00:00Z"), j.rates[day].CHF]);
    } else {
      const r = await fetch("https://api.coingecko.com/api/v3/coins/" + asset + "/market_chart?vs_currency=eur&days=" + days);
      if (!r.ok) throw new Error(r.status);
      pts = (await r.json()).prices;
    }
    pts = (pts || []).filter(p => Array.isArray(p) && isFinite(p[1]));
    if (pts.length < 2) throw new Error("leer");
    const out = { t: pts.map(p => p[0]), v: pts.map(p => p[1]), at: Date.now() };
    HIST[k] = out;
    return out;
  }
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); return e; };
  const trendColor = v => v[v.length - 1] >= v[0] ? "var(--ok)" : "var(--bad)";

  function drawSpark(el, h) {
    el.textContent = "";
    const W = 100, H = 32, min = Math.min(...h.v), max = Math.max(...h.v), span = (max - min) || 1;
    const t0 = h.t[0], tn = h.t[h.t.length - 1], ts = (tn - t0) || 1;
    const pts = h.v.map((v, i) => [((h.t[i] - t0) / ts) * W, H - 2 - ((v - min) / span) * (H - 4)]);
    const line = pts.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");
    const col = trendColor(h.v);
    const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", width: "100%", height: "100%", "aria-hidden": "true" });
    svg.append(
      svgEl("polygon", { points: "0," + H + " " + line + " " + W + "," + H, fill: col, "fill-opacity": ".12", stroke: "none" }),
      svgEl("polyline", { points: line, fill: "none", stroke: col, "stroke-width": "1.6", "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" })
    );
    el.append(svg);
  }
  let sparksAt = 0;
  async function loadSparks(force) {
    if (!force && Date.now() - sparksAt < 15 * 60 * 1000) return;
    sparksAt = Date.now();
    for (const a of Object.keys(SPARK_DAYS)) {
      const el = $(ASSETS[a].spark);
      try { drawSpark(el, await getHist(a, SPARK_DAYS[a])); }
      catch (e) { el.textContent = "kein Verlauf"; el.classList.add("empty"); sparksAt = 0; }
    }
  }

  /* großes Diagramm */
  const dFmt = (ms, withTime, withYear) => {
    const d = new Date(ms);
    let s = pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + (withYear ? String(d.getFullYear()).slice(2) : "");
    if (withTime) s += " " + hm(d);
    return s;
  };
  let sheetAsset = null, sheetDays = 0, sheetData = null;
  function drawChart() {
    const box = $("shChart");
    box.querySelectorAll("svg, .tip").forEach(n => n.remove());
    if (!sheetData) return;
    const h = sheetData, A = ASSETS[sheetAsset];
    const W = Math.max(240, box.clientWidth), H = 230;
    const L = 4, R = 64, T = 14, B = 24;
    let min = Math.min(...h.v), max = Math.max(...h.v);
    const padY = (max - min) * 0.08 || Math.abs(max) * 0.01 || 1;
    min -= padY; max += padY;
    const t0 = h.t[0], tn = h.t[h.t.length - 1];
    const x = t => L + ((t - t0) / ((tn - t0) || 1)) * (W - L - R);
    const y = v => T + (1 - (v - min) / (max - min)) * (H - T - B);
    const col = trendColor(h.v);
    const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", height: H, role: "img",
      "aria-label": A.name + ": Verlauf von " + A.fmt(h.v[0]) + " auf " + A.fmt(h.v[h.v.length - 1]) });
    // Raster + Achsenbeschriftung rechts
    for (let i = 0; i <= 3; i++) {
      const v = min + (max - min) * (i / 3), yy = y(v);
      svg.append(svgEl("line", { x1: L, x2: W - R, y1: yy, y2: yy, stroke: "var(--line)", "stroke-width": 1 }));
      const lab = svgEl("text", { x: W - R + 6, y: yy + 4, fill: "var(--muted)", "font-size": 11 });
      lab.textContent = A.fmt(v);
      svg.append(lab);
    }
    // Zeitachse: Anfang, Mitte, Ende
    const daily = sheetAsset === "fx", short = sheetDays <= 1;
    [[t0, "start"], [(t0 + tn) / 2, "middle"], [tn, "end"]].forEach(([t, anchor]) => {
      const lab = svgEl("text", { x: x(t), y: H - 6, fill: "var(--muted)", "font-size": 11, "text-anchor": anchor });
      lab.textContent = short ? hm(new Date(t)) : dFmt(t, false, sheetDays >= 365);
      svg.append(lab);
    });
    const pts = h.v.map((v, i) => x(h.t[i]).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
    svg.append(
      svgEl("polygon", { points: x(t0) + "," + (H - B) + " " + pts + " " + x(tn) + "," + (H - B), fill: col, "fill-opacity": ".12" }),
      svgEl("polyline", { points: pts, fill: "none", stroke: col, "stroke-width": 2, "stroke-linejoin": "round" })
    );
    const cross = svgEl("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" });
    const dot = svgEl("circle", { r: 4.5, fill: col, stroke: "var(--bg)", "stroke-width": 2, cx: x(tn), cy: y(h.v[h.v.length - 1]) });
    svg.append(cross, dot);
    box.append(svg);
    const tip = document.createElement("div");
    tip.className = "tip"; tip.hidden = true;
    box.append(tip);
    const show = clientX => {
      const r = svg.getBoundingClientRect();
      const px = (clientX - r.left) * (W / r.width);
      let best = 0, bd = Infinity;
      for (let i = 0; i < h.t.length; i++) { const d = Math.abs(x(h.t[i]) - px); if (d < bd) { bd = d; best = i; } }
      const cx = x(h.t[best]), cy = y(h.v[best]);
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
      dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
      tip.hidden = false;
      tip.textContent = "";
      const b = document.createElement("b"); b.textContent = A.fmt(h.v[best]);
      const s = document.createElement("span"); s.textContent = daily ? dFmt(h.t[best], false, true) : dFmt(h.t[best], true, sheetDays >= 365);
      tip.append(b, s);
      const sx = cx * (r.width / W);
      const tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(r.width - tw, sx - tw / 2)) + "px";
    };
    const hide = () => {
      cross.setAttribute("visibility", "hidden"); tip.hidden = true;
      dot.setAttribute("cx", x(tn)); dot.setAttribute("cy", y(h.v[h.v.length - 1]));
    };
    svg.addEventListener("pointerdown", e => show(e.clientX));
    svg.addEventListener("pointermove", e => show(e.clientX));
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") setTimeout(hide, 1500); });
  }
  async function loadSheet() {
    const A = ASSETS[sheetAsset], want = sheetAsset + ":" + sheetDays;
    $("shInfo").textContent = "Lade Verlauf …";
    sheetData = null; drawChart();
    try {
      const h = await getHist(sheetAsset, sheetDays);
      if (want !== sheetAsset + ":" + sheetDays) return;
      sheetData = h;
      const first = h.v[0], last = h.v[h.v.length - 1], pct = (last - first) / first * 100;
      $("shPrice").textContent = A.fmt(last);
      const label = A.ranges.find(r => r[0] === sheetDays)[1];
      $("shChg").innerHTML = chg(pct) + " in " + label;
      $("shInfo").textContent = "Tippe oder ziehe auf dem Diagramm für einzelne Werte.";
      drawChart();
    } catch (e) {
      if (want !== sheetAsset + ":" + sheetDays) return;
      $("shInfo").textContent = "Verlauf nicht verfügbar. Bitte später nochmal versuchen.";
    }
  }
  function renderRanges() {
    const wrap = $("shRanges"); wrap.textContent = "";
    for (const [d, lab] of ASSETS[sheetAsset].ranges) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "seg-btn"; b.textContent = lab;
      b.setAttribute("aria-pressed", String(d === sheetDays));
      b.addEventListener("click", () => { sheetDays = d; renderRanges(); loadSheet(); });
      wrap.append(b);
    }
  }
  function openSheet(asset) {
    sheetAsset = asset;
    const A = ASSETS[asset];
    sheetDays = A.ranges[asset === "fx" ? 0 : 1][0];
    $("shTitle").textContent = A.name;
    $("shSub").textContent = A.sym;
    $("shPrice").textContent = "–"; $("shChg").textContent = "";
    renderRanges();
    $("sheet").hidden = false;
    if (location.hash !== "#verlauf") location.hash = "verlauf";
    loadSheet();
  }
  function closeSheet() { $("sheet").hidden = true; sheetData = null; }
  $("shBack").addEventListener("click", () => { if (location.hash === "#verlauf") history.back(); else closeSheet(); });
  window.addEventListener("hashchange", () => { if (location.hash !== "#verlauf") closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) $("shBack").click(); });
  window.addEventListener("resize", () => { if (!$("sheet").hidden) drawChart(); });
  document.querySelectorAll("[data-asset]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.asset)));
  if (location.hash === "#verlauf") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }

  /* ---------- Akku (Battery Status API: Android/Chrome ja, iPhone/Safari nein) ---------- */
  async function initBattery() {
    if (!navigator.getBattery) {
      $("batSub").textContent = "Vom Browser nicht unterstützt";
      return;
    }
    /* Brave meldet aus Datenschutzgründen immer 100 % / lädt – das wäre falsch */
    if (navigator.brave) {
      $("batSub").textContent = "Brave verbirgt den Akkustand – in Chrome öffnen";
      return;
    }
    try {
      const b = await navigator.getBattery();
      const draw = () => {
        const lvl = Math.round(b.level * 100);
        $("bat").innerHTML = lvl + '<span class="unit">%</span>';
        const bar = $("batBar");
        bar.style.width = lvl + "%";
        bar.style.background = lvl <= 15 ? "var(--bad)" : lvl <= 30 ? "var(--warn)" : "var(--ok)";
        $("batSub").textContent = b.charging ? "Lädt" : "Entlädt";
      };
      draw();
      b.addEventListener("levelchange", draw);
      b.addEventListener("chargingchange", draw);
    } catch (e) {
      $("batSub").textContent = "Kein Zugriff";
    }
  }

  /* ---------- Bildschirm an lassen (Wake Lock) ---------- */
  let lock = null;
  $("wake").addEventListener("click", async () => {
    const btn = $("wake");
    if (lock) { try { await lock.release(); } catch (e) {} lock = null; btn.setAttribute("aria-pressed", "false"); return; }
    try {
      lock = await navigator.wakeLock.request("screen");
      btn.setAttribute("aria-pressed", "true");
      lock.addEventListener("release", () => { lock = null; btn.setAttribute("aria-pressed", "false"); });
    } catch (e) { btn.textContent = "Nicht möglich"; }
  });

  $("refresh").addEventListener("click", () => { loadWeather(); loadCrypto(); loadFx(); if (!$("viewKurse").hidden) loadSparks(true); });
  loadWeather(); loadCrypto(); loadFx(); initBattery();
  setInterval(loadWeather, 15 * 60 * 1000);
  setInterval(loadCrypto, 2 * 60 * 1000);
  setInterval(loadFx, 6 * 60 * 60 * 1000);
})();
</script>
</body></html>
